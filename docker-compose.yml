services:
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    ports:
      - "6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3210
    depends_on:
      convex-backend:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CONVEX_URL: ${CONVEX_URL:-http://convex-backend:3210}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://localhost:3211}
      CONVEX_JWKS_URL: http://convex-backend:3211
      CONVEX_SERVICE_KEY: ${CONVEX_SERVICE_KEY}
      CONVEX_ADMIN_KEY: ${CONVEX_ADMIN_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:80}
    depends_on:
      convex-backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3000}
        VITE_SERVER_WS: ${VITE_SERVER_WS:-ws://localhost:3000}
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:-http://localhost:3210}
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  convex-data:
